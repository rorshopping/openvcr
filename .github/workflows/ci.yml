name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test core
        run: pytest tests/ -q
      - name: Smoke — out-of-the-box experience
        run: |
          pip wheel --no-deps -w dist .
          python -m venv /tmp/openvcr-smoke
          /tmp/openvcr-smoke/bin/pip install --quiet dist/*.whl
          (/tmp/openvcr-smoke/bin/openvcr demo --port 8899 &) 
          sleep 2
          curl -sf http://127.0.0.1:8899/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-4o","messages":[{"role":"user","content":"What is the capital of France?"}]}' \
            | grep -q "Paris" && echo "✓ demo replay works out of the box"
          curl -sf http://127.0.0.1:8899/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-4o","stream":true,"messages":[{"role":"user","content":"Say hello."}]}' \
            | grep -q "data: " && echo "✓ streaming replay works out of the box"

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Test waitlist API
        run: pytest tests/test_waitlist.py -q
